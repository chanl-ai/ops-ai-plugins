[project]
name = "ops-plugin-starters"
version = "0.1.0"
description = "The starters pack for Ops AI: skills a team starts from, as templates"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["ops-plugin-sdk"]

# How tools-service finds it: every installed package in this group is a plugin.
[project.entry-points."ops_ai.plugins"]
starters = "ops_plugin_starters:plugin"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_plugin_starters"]

# The licenses of the adapted skills travel with every copy of the pack.
[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "ops_plugin_starters/THIRD_PARTY_NOTICES.md"

[tool.uv.sources]
# The kit from the ops-ai checkout beside this repository; a release pins the kit by version instead.
ops-plugin-sdk = { path = "../../../ops-ai/packages/ops_plugin_sdk", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
