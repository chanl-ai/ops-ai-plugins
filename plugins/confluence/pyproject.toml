[project]
name = "ops-plugin-confluence"
version = "0.1.0"
description = "The Confluence plugin for Ops AI: a knowledge source over the pages and attachments of Confluence Cloud and Data Center spaces, kept current with CQL"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["ops-plugin-sdk"]

# How tools-service finds it: every installed package in this group is a plugin.
[project.entry-points."ops_ai.plugins"]
confluence = "ops_plugin_confluence:plugin"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_plugin_confluence"]

[tool.uv.sources]
# The kit from the ops-ai checkout beside this repository; a release pins the kit by version instead.
ops-plugin-sdk = { path = "../../../ops-ai/packages/ops_plugin_sdk", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
