[project]
name = "ops-plugin-github"
version = "0.2.0"
description = "The GitHub plugin for Ops AI: OAuth sign-in, issue reads and a comment write"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["ops-plugin-sdk"]

# How tools-service finds it: every installed package in this group is a plugin.
[project.entry-points."ops_ai.plugins"]
github = "ops_plugin_github:plugin"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_plugin_github"]

[tool.uv.sources]
# The kit from the ops-ai checkout beside this repository; a release pins the kit by version instead.
ops-plugin-sdk = { path = "../../../ops-ai/packages/ops_plugin_sdk", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
