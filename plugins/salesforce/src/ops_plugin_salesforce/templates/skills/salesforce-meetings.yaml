# Loaded when the person asks about their own meetings or calls, as Salesforce holds them.
name: Salesforce meetings
useWhen: The person's own meetings and calls held in Salesforce, today or on a day they name, who each is with, and what it is about
loading: on_match
instructions: |-
  Meetings and calls are Salesforce Events. Read the person's own with USING SCOPE mine, never by a user id:
    SELECT Id, Subject, StartDateTime, EndDateTime, Location, Description, Who.Name, What.Name, WhatId, WhoId
    FROM Event USING SCOPE mine WHERE StartDateTime = TODAY ORDER BY StartDateTime
  For another day use a date literal (TOMORROW, NEXT_N_DAYS:7) or a date; for "my 2 pm" read today's and pick the one
  starting at 2 pm in the person's time. What.Name is the account or opportunity the meeting is about and Who.Name the
  contact; to prepare for it, go on with the client skill on that account.
  If they asked about a day and it has no event, say in one line that Salesforce has no meetings for them then.
  If they named one meeting ("my 2 pm") and none matches, say so and ask who it is with.
