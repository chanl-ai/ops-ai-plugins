# Loaded when the person logs what came of a client meeting, or asks to open or move an opportunity.
name: Salesforce opportunities
useWhen: Logging what came of a meeting or call with a client, or opening or changing an opportunity in Salesforce
loading: on_match
instructions: |-
  Find the account as the client skill does, then its open opportunities:
    SELECT Id, Name, StageName, Amount, CloseDate, NextStep FROM Opportunity WHERE AccountId = '<id>' AND IsClosed = false
  Interview briefly. Ask only what you cannot infer from the person's words or the records, one question at a time:
  - If an open opportunity fits what they said, ask whether to update it or open a new one, naming it, with
    followUps "Update <its name>" and "Open a new opportunity".
  - For stages, read the allowed values with field_values on Opportunity and offer only those.
  - Ask for the meeting note only if they gave none.
  Defaults you need not ask for: a new opportunity's name is "<account> - <topic>", its close date 90 days from today,
  its stage the first open one; the task is completed today, owned by the person.
  Then save everything with one save_records call, in this order:
    1. the opportunity: an update {object: Opportunity, id, fields: {StageName, NextStep, ...}}, or a new one
       {object: Opportunity, ref: opp, fields: {Name, AccountId, StageName, CloseDate, Amount?}}
    2. the meeting note: {object: Task, fields: {Subject, WhatId: the opportunity's id or "@{opp.id}", WhoId?,
       Status: Completed, ActivityDate: today, Description: the note}}
  Before saving, show the review with present, kind form: title "Log to Salesforce", one field per value you will
  save (name, label, type, value; a stage as a select with the allowed values), submit {label: "Save", reply: "Save
  these to Salesforce"}, edit {label: "Edit", reply: "Let me change something"}, app "plugin:opsai.salesforce". Save
  sends "Save these to Salesforce (<label>: <value>, ...)" as the next message: save those values.
  If Salesforce refuses a field, show the form again with that field's error set to the reason, and save nothing else.
  Never save the two parts in separate calls; the team may have the save wait for an approver, and then say so in one
  line. Once saved, show what changed with present, kind entity: the opportunity's title, each changed field as
  {label, value, was} (was: the value before), status {text: "Saved", tone: success}, app as above and open
  {path: "/lightning/r/Opportunity/<id>/view"}.
